<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Revisão responsiva — Vino Tobar</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e6ece6;color:#252820;font:14px system-ui}header{padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{padding:8px;border:1px solid #626b46;background:#f7f3e8;color:#252820}button[aria-pressed=true]{background:#626b46;color:#fff}#stage{margin:0 auto;position:relative}iframe{border:0;transform-origin:top left;display:block;background:#f7f3e8}pre{padding:12px;white-space:pre-wrap;font-size:11px}label{display:flex;align-items:center;gap:8px}</style>
<header><strong>Revisão do site publicado</strong><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1440">1440 px</button><label>Trecho<select id="section"><option value="#inicio">Abertura</option><option value=".hero-art">Encontro</option><option value=".hero-caption">Frases corrigidas</option><option value="#experiencia">Experiência</option><option value="#programacao">Programação</option><option value="#catalogo">Catálogo</option><option value=".selection-02">Seleção 02</option><option value=".selection-03">Seleção 03</option><option value=".house">Casa</option><option value="#visite">Localização</option><option value="#contato">Contato</option><option value="footer">Rodapé</option></select></label><label>Texto<select id="textsize"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="audit">Verificar geometria</button><button id="motion">Pausar movimento</button></header>
<div id="stage"><iframe title="Site em revisão" src="/vino_tobar_site/" width="390" height="800"></iframe></div><pre id="report" aria-live="polite"></pre>
<script>
const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),report=document.querySelector('#report');let width=390;const originalSizes=new WeakMap();
function resize(){const scale=Math.min(1,(innerWidth-24)/width);frame.style.width=width+'px';frame.width=width;frame.style.transform=`scale(${scale})`;stage.style.width=width*scale+'px';stage.style.height=800*scale+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.width)===width)));}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);resize();report.textContent='Largura ajustada. Use Verificar geometria após a entrada.'});window.addEventListener('resize',resize);resize();
document.querySelector('#section').onchange=e=>frame.contentDocument.querySelector(e.target.value)?.scrollIntoView({behavior:'instant',block:'start'});
document.querySelector('#textsize').onchange=e=>{const scale=Number(e.target.value);frame.contentDocument.querySelectorAll('h1,h2,h3,p,a,span,summary,address,small,button').forEach(el=>{if(!originalSizes.has(el))originalSizes.set(el,parseFloat(frame.contentWindow.getComputedStyle(el).fontSize));el.style.fontSize=originalSizes.get(el)*scale+'px';});};
document.querySelector('#motion').onclick=()=>{const d=frame.contentDocument;let style=d.querySelector('#qa-pause');if(style){style.remove();return;}style=d.createElement('style');style.id='qa-pause';style.textContent='*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}';d.head.append(style);};
document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,images=[...d.querySelectorAll('main img')].map(el=>({el,r:el.getBoundingClientRect()})),texts=[...d.querySelectorAll('main h1,main h2,main h3,main p,main a,.margin-note,.photo-note,figcaption')],overlaps=[];for(const el of texts){const r=el.getBoundingClientRect();for(const im of images)if(r.width&&r.height&&r.left<im.r.right-.5&&r.right>im.r.left+.5&&r.top<im.r.bottom-.5&&r.bottom>im.r.top+.5)overlaps.push(el.textContent.trim().slice(0,90));}const outOfBounds=texts.filter(el=>{const r=el.getBoundingClientRect();return r.width&&(r.left<-.5||r.right>w.innerWidth+.5);}).map(el=>el.textContent.slice(0,90));report.textContent=JSON.stringify({viewport:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,overlaps,outOfBounds,fonts:d.fonts.status,allImages:[...d.images].map(i=>({loaded:i.complete&&i.naturalWidth>0,alt:i.alt.slice(0,45)}))},null,2);};
</script></html>
